<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- Criar uma página em que o usuário insira 2 números, e possa escolher qual operação aritmética deseja realizar (soma, subtração, divisão ou multiplicação). Mostrar no PHP o resultado da conta escolhida, utilizando os números digitados. -->

    <form action="pagina.php" method="post"><br>
        Soma: <input type="radio" name="operacao" value="1"><br>
        Subtração: <input type="radio" name="operacao" value="2"><br>
        Multiplicação: <input type="radio" name="operacao" value="3"><br>
        Divisão: <input type="radio" name="operacao" value="4"><br>

        Número 1: <input type="number" name="n1"><br>
        Número 2: <input type="number" name="n2"><br>

        <button>Enviar</button>
        <a href="pagina.php"></a>
    </form>

</body>
